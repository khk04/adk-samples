[project]
name = "mvp-1"
version = "0.1.0"
description = "멀티 에이전트 기반 데이터 분석 및 리포트 생성 시스템 - 고품질 리포트를 자동 생성하고 품질을 평가합니다."
authors = [
    {name = "MVP Developer", email = "developer@example.com"}
]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.1.1"
google-adk = { version = ">=0.5.0", extras = ["eval"] }
google-genai = "^1.21.1"
pydantic = "^2.10.6"
python-dotenv = "^1.0.1"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
openpyxl = "^3.1.2"
pdfplumber = "^0.10.3"
pypdf = "^3.17.4"
anyio = "^4.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"