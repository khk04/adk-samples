version: '3.8'

services:
  # 백엔드: Document Question & Report Agent
  doc-question-report-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: doc-question-report-agent:latest
    container_name: doc-question-report-agent-container
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - MAX_TOKENS=${MAX_TOKENS:-4000}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - DEBUG=${DEBUG:-false}
    networks:
      - doc-question-network
    depends_on:
      - redis

  # 프론트엔드: Vue.js 웹 애플리케이션
  doc-agent-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: doc-agent-frontend:latest
    container_name: doc-agent-frontend-container
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    networks:
      - doc-question-network
    depends_on:
      - doc-question-report-agent
      - redis

  # Redis: 세션 및 캐시 관리
  redis:
    image: redis:7-alpine
    container_name: doc-question-report-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doc-question-network

volumes:
  redis_data:
    driver: local

networks:
  doc-question-network:
    driver: bridge
    name: doc-question-network