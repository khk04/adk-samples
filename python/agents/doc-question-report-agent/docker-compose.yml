services:
  # 백엔드: Document Question & Report Agent
  doc-question-report-agent:
    build:
      context: ./doc_question_report_agent
      dockerfile: Dockerfile
    container_name: doc-question-report-agent-container
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - output:/app/output
      - temp:/app/temp
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 프론트엔드: Vue.js 웹 인터페이스
  doc-agent-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc-agent-frontend-container
    ports:
      - "8080:80"
    depends_on:
      - doc-question-report-agent
    restart: unless-stopped

volumes:
  uploads:
    driver: local
  output:
    driver: local
  temp:
    driver: local
  logs:
    driver: local